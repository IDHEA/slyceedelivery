<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slycee momo</title>

    <style>
        :root {
            --bg: #b8b9a8;
            --card-bg: #8f917d;
            --dark: #111;
            --red: #c0392b;
            --blue: #1e90ff;
            --yellow: #f1c40f;
            --green: #2ecc71;
            --purple: #6c7ae0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: var(--bg);
            color: #111;
        }

        /* ---------- HEADER ---------- */
        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .call-btn {
            display: inline-block;
            padding: 10px 25px;
            border: 2px solid var(--red);
            color: var(--red);
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
        }

        /* ---------- NAVBAR ---------- */
        .navbar {
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            z-index: 10;
        }

        .logo {
            background: #2d7ff9;
            color: #fff;
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: bold;
        }

        .nav-links a {
            margin: 0 10px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }

        .contact-btn {
            background: var(--red);
            color: #fff;
            padding: 10px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
        }

        /* ---------- GRID ---------- */
        .container {
            max-width: 1200px;
            margin: 30px auto 60px;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 360px;
        }

        .card img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .order-btn {
            align-self: flex-start;
            padding: 10px 22px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            color: #fff;
        }

        .blue { background: #17a2b8; }
        .yellow { background: #d4a017; }
        .green { background: #2ecc71; }
        .purple { background: #6c7ae0; }

        /* ---------- FOOTER ---------- */
        footer {
            background: #000;
            color: #fff;
            text-align: center;
            padding: 18px;
            font-size: 14px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 600px) {
            header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
     <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">
            <a href="index2.html">Slcee delivery</a></div>
<p>MAKE PAYMENT</p>
        <a href="#" class="contact-btn">Contact Us</a>
    </div>
  <img src="D2.jpeg" alt="" style="width:100vw;height:50.vh;object-fit:cover;">
  <div class="container">
    <div class="grid">
      <div class="card blue">
        <h3>NOTE</h3>
Call us after the payment, to confirm your actual location. Cash on delivery is also accepted.</p>  
      </div> 
<footer>
        © 2025 Slycee Delivery. All rights reserved.
    </footer>

</body>
</html>
